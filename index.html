<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #222;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        img {
            width: 100px;
            transition: transform 0.2s;
        }

        .rolling {
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
    <h1>Dice Game 🎲</h1>
    <img src="dice1.png" alt="dice">
    <br>
    <button>Roll Dice</button>
    </div>
</body>
<script>
    const button = document.querySelector('button');
    const headone = document.querySelector('h1');
    const diceImage = document.querySelector('img');

    button.addEventListener('click', () => {
        const randomNumber = Math.floor(Math.random() * 6) + 1;

        // add animation class
        diceImage.classList.add('rolling');
        // remove animation class after ends
        setTimeout(() => {
            diceImage.classList.remove('rolling');
        }, 500);

        // change dice image
        diceImage.src = `dice${randomNumber}.png`;
        // change heading text
        headone.textContent = `You rolled a ${randomNumber}!`;
    });
</script>
</html>
